onboarding = false

[keys]
# Same prefix as tmux.
prefix = "ctrl+a"
# Step through tabs without the prefix. Left/right to match the tab row at the
# bottom, and not Alt+J/K, which LazyVim uses to move lines.
previous_tab = ["prefix+p", "alt+h"]
next_tab = ["prefix+n", "alt+l"]

[ui]
status_indicators = "symbols"
# Tabs along the bottom, where tmux keeps its status line.
tab_bar_position = "bottom"

[ui.toast]
delivery = "herdr"

[theme]
name = "tokyo-night"
auto_switch = false
